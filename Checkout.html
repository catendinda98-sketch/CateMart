<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | CateMart</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

<header>
    <a class="logo" href="index.html">CateMart</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
    </nav>

    <input id="searchInput" class="search-box"
           type="search" placeholder="Search products..."
           aria-label="Search products">
</header>

<main>

    <div class="form-container">

        <h2>Checkout</h2>

        <h3>Order Summary</h3>

        <div id="checkoutSummary"></div>

        <h3>Total: <span id="checkoutTotal">KSh 0</span></h3>

        <form onsubmit="placeOrder(event)">

            <input type="text" id="customerName"
                   placeholder="Full Name" required>

            <input type="tel" id="customerPhone"
                   placeholder="Phone Number" required>

            <input type="email" id="customerEmail"
                   placeholder="Email Address" required>

            <textarea id="deliveryAddress"
                      placeholder="Delivery Address"
                      required></textarea>

            <select id="paymentMethod" required>
                <option value="">Select Payment Method</option>
                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>
                <option value="M-Pesa">
                    M-Pesa (Demo)
                </option>
            </select>

            <button type="submit">Place Order</button>

        </form>

        <p id="orderMessage" class="message"></p>

    </div>

</main>

<footer>
    <h2>CateMart</h2>
    <p>Your online shopping destination.</p>
    <p>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
    </p>
    <p>&copy; 2026 CateMart. All rights reserved.</p>
</footer>

</body>
</html>
